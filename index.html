<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Picture of the Day</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=stars" >
  <link rel="stylesheet" href="./style.css" >
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <nav class="topnav">
      <a class="home-link" href="index.html">HOME</a>
      <ul class="nav-links">
        <li><a href="#">About Us</a></li>
        <li><a href="#">Favourites</a></li>
        <li><a href="#">Search</a></li>
      </ul>
    </nav>
  </header>

  <main id="main" class="container">
    <h1 class="bold">Picture of the Day</h1>

    <!-- Feature -->
    <div class="feature" id="feature">
      <div class="feature-media" id="feature-media">
        <img
          src=""
          alt="">
      </div>    

      <div class="feature-info">
        <h2 class="feature-title"></h2>
        <p class="info"></p>
        <p><a class="readmore" id="add-btn" href="#">Add to Favourites</a></p>
      </div>
    </div>

    <!-- Search by date -->
    <div class="search-by-date">
      <h3 id="search-label">Search by date</h3>
      <input type="date" class="inputbox">
    </div>

  </main>

  <!-- Search result with full-width background -->
  <div class="favorited">
    <h2>Your Favourites</h2>
    <div class="favouritesbox">
      
    </div>
  </div>

  <!-- Light room / Lightbox modal -->
<dialog id="lightbox" aria-labelledby="lightbox-title">
  <button id="lightbox-close" class="iconbtn" aria-label="Close">✕</button>
  <figure>
    <img id="lightbox-img" alt="">
    <figcaption id="lightbox-cap">
      <strong id="lightbox-title"></strong>
      <span id="lightbox-desc"></span>
    </figcaption>
  </figure>
</dialog>


  <footer class="site-footer">
    <small>Copyright@copyright</small>
  </footer>
  <script src="script.js"></script>
</body>
</html>
